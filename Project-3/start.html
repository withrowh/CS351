<!DOCTYPE html>
<html>
    <head>
        <script src="initShaders.js"></script>

        <script id="vertex-shader" type="x-shader/x-vertex">
        out vec3 vColor;
        out float radius;
        out float angle;
        out float vId;
        flat out int id;
        uniform float N, t;
            void main() {
                //Lets the color change with the VertexID
                vColor[gl_VertexID % 3] = radius;
                
                if (gl_VertexID == 0){
                    gl_Position = vec4(0.0, 0.0, 0.0, 1.0);
                   return;
                }
                
                float radius = (gl_VertexID % 2) == 0 ? 1.0 : 0.4;
                
                float vId = float(gl_VertexID);
                
                const float Pi = 3.14159265358979;
                float angle = (vId * 2.0 * Pi / (N)) + t;
                vec2 v = radius * (vec2(cos(angle), sin(angle)));
                
                gl_Position = vec4(v, 0.0, 1.0);
            }
        </script>
        
        <script id="fragment-shader" type="x-shader/x-fragment">
        in float vId;
        in vec3 vColor;        
        out vec4 fColor;
        uniform float N, t;
            void main() {
                //vColor gives me a rgb rainbow :)
                //fColor = vec4(vColor, 1.0);

                //will allow mix to shift from red to blue and back again
                float pct = cos(t);
                
                const vec4 red = vec4(1.0, 0.0, 0.0, 1.0);
                const vec4 blue = vec4(0.0, 0.0, 1.0, 1.0);
                
                fColor = mix(red, blue, pct + 0.5);
            }
        </script>

        <script>
            window.onload = () => {
                var canvas = document.getElementById("webgl");
                var gl = canvas.getContext("webgl2");
                
                const N = 12;

                gl.clearColor(0.1, 0.1, 0.1, 1.0);

                var program = initShaders(gl, "vertex-shader", "fragment-shader");
                
                // These are lines that we'll need a bit later.
                 var uN = gl.getUniformLocation(program, "N");
                 var uTime = gl.getUniformLocation(program, "t");

                var t = 0.0;

                var render = () => {
                    t += 0.01;  // Tick time

                    gl.clear(gl.COLOR_BUFFER_BIT);
                    gl.useProgram(program);

                    // Other code we'll need later, in combination with the
                    //   code above marked for later use.
                     gl.uniform1f(uN, N);
                     gl.uniform1f(uTime, t);
                    
                    //Below is changed for Triangle Fan
                    // Why does 2 * N work but not doubling N above
                    gl.drawArrays(gl.TRIANGLE_FAN, 0, N + 2);

                    requestAnimationFrame(render);
                };

                render();
            };
        </script>
    </head>

    <body>
        <canvas id="webgl" width="512" height="512"></canvas>
    </body>
</html>
